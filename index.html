<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>インスタリスト</title>
    <!-- Tailwind CSSの読み込みを追加 -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-8">
    <h1 class="text-2xl font-bold mb-8">
        インスタグラム一覧
    </h1>
    <div id="userList" class="grid gap-4"></div>

    <script>
    async function LoadUsers() {
        const userList = document.getElementById("userList");
        try {
            const response = await fetch("https://jsonplaceholder.typicode.com/users");
            if (!response.ok) {
                throw new Error("通信エラー:" + response.status);
            }

            const users = await response.json();
            console.log(users);
            userList.textContent = "";

            users.forEach((user) => {
                const card = document.createElement("div");
                card.className = "bg-white rounded-lg shadow p-4";

                const name = document.createElement("h2");
                name.className = "text-lg font-bold";
                name.textContent = user.name; // 文字代入を追加

                const email = document.createElement("p");
                email.className = "text-gray-600 text-sm";
                email.textContent = user.email; // className ではなく textContent に修正

                card.appendChild(name);
                card.appendChild(email);
                userList.appendChild(card);
            });
        } catch (error) {
            userList.textContent = "データの取得に失敗しました。";
            console.error(error);
        }
    }

    // 関数の外で実行する
    LoadUsers();
    </script>
</body>
</html>
