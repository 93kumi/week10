<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GITユーザーFETCH</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">

<main class="bg-white w-full max-w-md p-8 rounded-xl shadow-lg">
<h1 class= "text-2xl font-bold mb-8">
    GITのユーザーあて
</h1>

<div class="flex gap-2 mb-4">
    <input id ="username"
    type="text"
    placeholder="GITのユーザーを当てて差し上げましょう"
    class="flex-1 border border-gray-400 rounded-lg px-4 py-2 focus:outline focus:ring-brawn-500">

<button
    id="searchButton"
    class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-brown-600">
    検索しなさい
</button>
</div> 



<p id="message" class="text-red-400 text-center mb-2"></p>

<section id="userInfo" class="hidden text-center">

    <img
    id="avatar"
    src=""
    alt="GITのアバター"
    class="w-32 h-32 rounded-full mx-auto mb-4"
    >

    <h2 id="name" class="text-xl font-bold mb-2"></h2>

    <p id ="bio" class="text-gray-600 mb-4"></p>
    <p class="text-gray-700">
        フォロワー：
        <span id="followers" class="font-bold"></span>
    </p>

</section>
</main>


<script>
const usernameInput = document.getElementById("username");
const searchButton = document.getElementById("searchButton");

searchButton.addEventListener("click", () => {
    console.log("ボタンが押されました！");
});


const message = document.getElementById("message");
const userInfo = document.getElementById("userInfo");

const avatar = document.getElementById("avatar");
const name = document.getElementById("name");
const bio = document.getElementById("bio");
const followers = document.getElementById("followers");

searchButton.addEventListener("click", async () => {

    const username = usernameInput.value.trim();

    message.textContent = "";
    userInfo.classList.add("hidden");

    if (!username) {
        message.textContent = "ユーザーを入れてよね。";
        return;
    }

    try {
        const response = await fetch(
            `https://api.github.com/users/${username}`
        );

        console.log("response:", response);

        if (!response.ok) {
            message.textContent = "ユーザーが存在しないなぁ";
            return;
        }

        const data = await response.json();

        console.log("取得したデータ:", data);

        avatar.src = data.avatar_url;
        name.textContent = data.name || "名前はまだない。";
        bio.textContent = data.bio || "自己紹介がないようだ。";
        followers.textContent = data.followers;

        userInfo.classList.remove("hidden");

    } catch (error) {
        console.error("エラー:", error);
        message.textContent = "通信に失敗しました";
    }
});
</script>
